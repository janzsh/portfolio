name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # astro sync + tsc --noEmit, Vitest, then the production build.
      - run: pnpm verify
        env:
          # The build only needs these to exist; nothing is sent from CI.
          RESEND_API_KEY: ci-placeholder
          CONTACT_TO_EMAIL: ci@example.com

      # axe-core over every page in both themes plus three Lighthouse runs, on the build that
      # verify just made (about a minute on the runner's preinstalled Chrome). It runs where a
      # regression can still be stopped: pull requests and main. Pushes to develop get only the
      # fast checks above.
      - name: Accessibility and performance audit
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: pnpm audit:web
